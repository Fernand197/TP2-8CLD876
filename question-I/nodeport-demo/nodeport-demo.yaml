# Démo NodePort : 3 pods "hello" qui répondent chacun avec leur propre nom,
# exposés par un Service NodePort sur le port 30007 de chaque nœud.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: hashicorp/http-echo:1.0.0
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          args:
            - "-listen=:5678"
            - "-text=Bonjour ! Reponse du pod $(POD_NAME)"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: hello-nodeport
spec:
  type: NodePort
  selector:
    app: hello
  ports:
    - name: http
      protocol: TCP
      port: 8080        # (1) port du Service sur son ClusterIP (accès interne au cluster)
      targetPort: 5678  # (2) port sur lequel écoute le conteneur
      nodePort: 30007   # (3) port ouvert sur CHAQUE nœud (plage 30000-32767) -> accès externe
